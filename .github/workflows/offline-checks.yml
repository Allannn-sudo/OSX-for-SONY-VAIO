name: Offline checks

on:
  push:
    branches: [main, vgn-y18c, 'feature/**', 'fix/**', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-checks:
    name: Portable source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run synthetic loader and branch-preparation tests
        run: python -B -m unittest discover -s tests -v
      - name: Build and run the 11 host protocol simulations
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++11 -Wall -Wextra -Werror scripts/ps2_init_protocol_sim.cpp -o "$RUNNER_TEMP/vaio-ps2-protocol-sim"
          "$RUNNER_TEMP/vaio-ps2-protocol-sim"
      - name: Check collector shell syntax without running it
        run: bash -n tools/Tiger-Input-State/Collect-Input-State.command
